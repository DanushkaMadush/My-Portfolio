<app-loading-screen [active]="isLoading()"></app-loading-screen>

<div class="app-shell" [class.is-loading]="isLoading()">
  <app-navbar></app-navbar>
  <main class="app-main" id="main-content" style="position: relative; overflow-x: hidden;">
    <div [@routeTransition]="getRoute(outlet)" style="position: relative; width: 100%;">
      <router-outlet #outlet="outlet" />
    </div>
  </main>
  <app-footer></app-footer>
</div>
