<section class="section">
  <div class="container">
    <app-section-header
      eyebrow="Contact"
      title="Get in touch"
      subtitle="Open to mid-level backend and full-stack roles, and freelance engagements. Response within 24 hours."
    />

    <div class="contact-grid">
      <app-contact-form class="section-card" />

      @if (profile(); as profileData) {
        <div class="contact-details">

          <div class="section-card">
            <h3>Direct channels</h3>
            <ul class="channel-list">
              <li>
                <lucide-icon [img]="Mail" [size]="16" />
                <a [href]="'mailto:' + profileData.contact.email">
                  {{ profileData.contact.email }}
                </a>
              </li>
              <li>
                <lucide-icon [img]="Linkedin" [size]="16" />
                <a [href]="profileData.contact.linkedin" target="_blank" rel="noopener">
                  LinkedIn
                </a>
              </li>
              <li>
                <lucide-icon [img]="Github" [size]="16" />
                <a [href]="profileData.contact.github" target="_blank" rel="noopener">
                  GitHub
                </a>
              </li>
              @if (profileData.contact.whatsapp) {
                <li>
                  <lucide-icon [img]="MessageCircle" [size]="16" />
                  <a [href]="profileData.contact.whatsapp" target="_blank" rel="noopener">
                    WhatsApp
                  </a>
                </li>
              }
            </ul>
          </div>

          <div class="section-card">
            <h3>My location</h3>
            <div class="location">
              <lucide-icon [img]="MapPin" [size]="16" />
              <p>{{ profileData.contact.location }}</p>
            </div>
          </div>

        </div>
      }
    </div>
  </div>
</section>
