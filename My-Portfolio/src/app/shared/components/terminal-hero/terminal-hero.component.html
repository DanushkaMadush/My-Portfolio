<div class="hero section">
  <div class="container hero-grid">
    <div class="terminal" [class.typing]="isTyping()">
      <div class="terminal-header">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="terminal-title">system.shell</span>
      </div>
      <div class="terminal-body">
        @for (line of lines; track line.id) {
          <p
            class="terminal-line"
            [style.--delay]="line.delay + 's'"
            [style.--chars]="line.chars"
          >
            {{ line.text }}
          </p>
        }
        <span class="cursor" aria-hidden="true"></span>
      </div>
    </div>

    <div class="hero-copy">
      <span class="tag">Associate Software Engineer · Sri Lanka</span>
      <h1>I architect fulll-stack systems in enterprise environments. Clean code, clear boundaries, no shortcuts.</h1>
      <!-- <p>
        .NET Core backends, Angular frontends, and the architectural decisions in between —
    including real-time features and breaking apart monoliths that
    got too big to maintain.
      </p> -->
      <div class="hero-actions">
        <a class="btn btn-primary" routerLink="/projects">View Projects</a>
        <a class="btn btn-secondary" routerLink="/contact">Contact Me</a>
      </div>
    </div>
  </div>
</div>
